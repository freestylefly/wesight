name: Build Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarization-status:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PWD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Inspect current release notarization requests
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format json > "$RUNNER_TEMP/notary-history.json"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          history = json.loads((Path(os.environ['RUNNER_TEMP']) / 'notary-history.json').read_text())
          requests = [item for item in history.get('history', []) if item.get('createdDate', '') >= '2026-11-08T05:34:00Z']
          summary = '\n'.join(json.dumps({key: item.get(key) for key in ('id', 'name', 'status', 'createdDate')}) for item in requests)
          print(summary or 'No notarization requests found for the current release.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Current release notarization requests\n\n```json\n' + summary + '\n```\n')
          PYTHON
